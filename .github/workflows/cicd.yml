# .github/workflows/cicd.yml
# jobs:                    0 spaces
# ··test:                  2 spaces
# ····runs-on:             4 spaces
# ····steps:               4 spaces
# ······- name:            6 spaces
# ········uses:            8 spaces

name: CI/CD Pipeline


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code 
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies 
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: python -m pytest test_app.py
